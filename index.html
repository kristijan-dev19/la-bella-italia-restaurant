<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>La Bella Italia</title>

<style>

{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Georgia, serif;
}


body{
background:#faf3e0;
color:#222;
}


/* TOP BAR */

header{

background:#3b0d0d;
padding:25px;

display:flex;
justify-content:space-between;
align-items:center;

}


.logo{

color:#d4af37;
font-size:30px;
font-weight:bold;

}


nav a{

color:white;
text-decoration:none;
margin-left:25px;
font-size:18px;

}


nav a:hover{

color:#d4af37;

}


/* HERO */


.hero{

height:90vh;

background:
linear-gradient(
rgba(0,0,0,.5),
rgba(0,0,0,.5)
),
url("restaurant.jpg");

background-size:cover;
background-position:center;

display:flex;
align-items:center;
padding-left:10%;

}


.hero div{

max-width:600px;
color:white;

}


.hero h1{

font-size:75px;
color:#d4af37;

}


.hero p{

font-size:25px;
margin:25px 0;

}



.btn{

background:#3b0d0d;
color:white;

padding:15px 35px;

border-radius:30px;

text-decoration:none;

display:inline-block;

}




/* STORY */


.section{

padding:80px 10%;

}


.title{

text-align:center;

font-size:45px;

color:#3b0d0d;

margin-bottom:40px;

}


.text{

text-align:center;

font-size:20px;

line-height:1.8;

}



/* SPECIALITIES */


.special{

display:flex;

justify-content:center;

gap:30px;

flex-wrap:wrap;

}


.item{

background:white;

width:300px;

border-radius:20px;

overflow:hidden;

box-shadow:0 10px 25px rgba(0,0,0,.15);

}


.item img{

width:100%;

height:220px;

object-fit:cover;

}


.item h2{

padding:20px;

color:#3b0d0d;

}


.item p{

padding:0 20px 20px;

}


.price{

color:#d4af37;

font-size:24px;

padding:20px;

}
