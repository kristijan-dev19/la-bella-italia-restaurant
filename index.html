<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>La Bella Italia</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Georgia, serif;
}


body{
    background:#fff8ed;
    color:#333;
}


/* NAV */

nav{
    background:#8b0000;
    padding:20px;
    display:flex;
    justify-content:center;
    gap:30px;
}


nav a{
    color:white;
    text-decoration:none;
    font-weight:bold;
    font-size:18px;
}


nav a:hover{
    color:#ffd700;
}



/* HERO */

.hero{

height:90vh;

background:
linear-gradient(
rgba(0,0,0,0.45),
rgba(0,0,0,0.45)
),
url("restaurant.jpg");

background-size:cover;
background-position:center;

display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:white;

}


.hero h1{

font-size:75px;
color:#ffd700;

}


.hero p{

font-size:25px;
margin:20px;

}



.btn{

background:#8b0000;
color:white;
padding:15px 35px;
border-radius:30px;
text-decoration:none;
font-weight:bold;

}



.btn:hover{

background:#b22222;

}



/* SECTIONS */


.container{

max-width:1200px;
margin:auto;
padding:70px 20px;

}


.title{

text-align:center;
font-size:45px;
color:#8b0000;
margin-bottom:40px;

}



/* ABOUT */


.about{

text-align:center;
font-size:20px;
line-height:1.7;

}




/* MENU */


.menu{

display:flex;
justify-content:center;
flex-wrap:wrap;
gap:30px;

}


.food{

background:white;
width:300px;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,.15);

}


.food img{

width:100%;
height:220px;
object-fit:cover;

}


.food h2{

color:#8b0000;
padding:15px;

}


.food p{

padding:15px;

}


.price{

padding:15px;
color:#d4af37;
font-size:25px;
font-weight:bold;

}
